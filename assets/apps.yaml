# Workspace layout for `start-apps`. Installed to ~/.config/app-launcher/apps.yaml.
# NOTE: the jetbrains-idea desktop-entry id below is generated by JetBrains
# Toolbox on first launch - update it after installing the IDE.
- workspace: 10
  check_pattern: thunderbird
  cmd: thunderbird

- workspace: 10
  check_pattern: signal
  cmd: signal-desktop

- workspace: 2
  check_pattern: firefox
  cmd: firefox

- workspace: 3
  check_pattern: jetbrains-idea
  cmd: gtk-launch jetbrains-idea-ef52faa1-3035-4ceb-a7cb-0dfdcf75b2e1.desktop

- workspace: 6
  check_pattern: microgui
  cwd: $HOME/Documents/
  cmd: microgui tmp.md:100000:1 TODO.md

- workspace: 6
  check_pattern: Blank Box
  cmd: blank-box

- workspace: 2

